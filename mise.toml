# mise (https://mise.jdx.dev) pins the development toolchain for this repo.
#
#   mise trust && mise install      # or: make install-deps
#
# Docker / Docker Compose are intentionally NOT managed here: install them
# separately (Docker Engine on Ubuntu, Docker Desktop/OrbStack/Colima on macOS).
# Keep these versions in sync with REQUIREMENTS.md and the Dockerfile's Go
# builder image when bumping them.

[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
helm = "4.3.2"
helm-docs = "1.14.2"
kind = "0.33.0"
kubectl = "1.36.2"
