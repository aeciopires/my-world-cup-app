# -- Number of pod replicas (ignored when autoscaling.enabled is true)
replicaCount: 1

image:
  # -- Container image repository
  repository: my-world-cup-app
  # -- Container image tag (defaults to .Chart.AppVersion when empty)
  tag: ""
  # -- Container image pull policy
  pullPolicy: IfNotPresent

# -- References to secrets used to pull the image from a private registry
imagePullSecrets: []

# -- Override the chart name used in generated resource names
nameOverride: ""
# -- Override the full generated resource name
fullnameOverride: ""

serviceAccount:
  # -- Whether to create a ServiceAccount for the pod
  create: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Name of the ServiceAccount to use (generated if empty and create=true)
  name: ""
  # -- Mount the ServiceAccount API token into the pod. The app never talks to
  # the Kubernetes API, so this is off by default.
  automountToken: false

podAnnotations:
  # -- Enables Prometheus scrape discovery for this pod
  prometheus.io/scrape: "true"
  # -- Port a cluster Prometheus should scrape for metrics
  prometheus.io/port: "8080"
  # -- Path a cluster Prometheus should scrape for metrics
  prometheus.io/path: "/metrics"

podSecurityContext:
  # -- Require the pod to run as a non-root user
  runAsNonRoot: true
  # -- UID to run as (matches the distroless "nonroot" user baked into the image)
  runAsUser: 65532
  # -- GID to run as
  runAsGroup: 65532
  seccompProfile:
    # -- Seccomp profile applied to the pod
    type: RuntimeDefault

securityContext:
  # -- Disallow privilege escalation for the container
  allowPrivilegeEscalation: false
  # -- Mount the container's root filesystem as read-only
  readOnlyRootFilesystem: true
  capabilities:
    # -- Linux capabilities to drop from the container
    drop: ["ALL"]

service:
  # -- Kubernetes Service type
  type: ClusterIP
  # -- Service port (also used as the Prometheus scrape port annotation)
  port: 8080

# -- Environment variables passed through to the container (see the app's
# README "Configuration" table). PORT must match service.port and
# containerPort if overridden. SHUTDOWN_DRAIN_DELAY keeps the pod serving
# while /readyz reports 503 after SIGTERM, so it leaves the Service's
# endpoints before connections close; keep it below terminationGracePeriodSeconds
# minus ~10s. Uncomment the OTEL_* entries to export traces to an
# OpenTelemetry collector (e.g. Grafana Alloy or the OpenTelemetry Collector).
env:
  PORT: "8080"
  LOG_FORMAT: "json"
  SHUTDOWN_DRAIN_DELAY: "5s"
  # FETCH_TIMEOUT: "10s"
  # WORLDCUP_MATCHES_URL: ""
  # WORLDCUP_GROUPS_URL: ""
  # WORLDCUP_TEAMS_URL: ""
  # WORLDCUP_STADIUMS_URL: ""
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.monitoring.svc:4318"
  # OTEL_SERVICE_NAME: "my-world-cup-app"
  # OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  # OTEL_TRACES_SAMPLER_ARG: "0.1"

# -- Seconds Kubernetes waits after SIGTERM before killing the pod. Must cover
# env.SHUTDOWN_DRAIN_DELAY plus the app's 10s graceful-shutdown window.
terminationGracePeriodSeconds: 30

# -- Port the application listens on inside the container
containerPort: 8080

resources:
  requests:
    # -- CPU request
    cpu: 50m
    # -- Memory request
    memory: 32Mi
  limits:
    # -- CPU limit
    cpu: 250m
    # -- Memory limit
    memory: 128Mi

# Probes: /healthz is liveness only ("is the process alive?"); /readyz is
# readiness ("send me traffic?") and turns 503 as soon as shutdown starts.
# The startup probe holds off liveness checks until the server answers once.

startupProbe:
  httpGet:
    # -- Startup probe HTTP path
    path: /healthz
    # -- Startup probe port (named container port)
    port: http
  # -- Seconds between startup probes
  periodSeconds: 2
  # -- Failed startup probes tolerated (periodSeconds x failureThreshold = max startup time)
  failureThreshold: 15
  # -- Seconds before a startup probe times out
  timeoutSeconds: 2

livenessProbe:
  httpGet:
    # -- Liveness probe HTTP path
    path: /healthz
    # -- Liveness probe port (named container port)
    port: http
  # -- Seconds between liveness probes
  periodSeconds: 15
  # -- Consecutive failures before the container is restarted
  failureThreshold: 3
  # -- Seconds before a liveness probe times out
  timeoutSeconds: 2

readinessProbe:
  httpGet:
    # -- Readiness probe HTTP path (503 while draining on shutdown)
    path: /readyz
    # -- Readiness probe port (named container port)
    port: http
  # -- Seconds between readiness probes (keep it below env.SHUTDOWN_DRAIN_DELAY)
  periodSeconds: 5
  # -- Consecutive failures before the pod is removed from Service endpoints
  failureThreshold: 1
  # -- Seconds before a readiness probe times out
  timeoutSeconds: 2

ingress:
  # -- Enable the Ingress resource
  enabled: false
  # -- IngressClass name (leave empty to use the cluster default)
  className: ""
  # -- Annotations to add to the Ingress resource
  annotations: {}
  # -- List of hosts and paths to route to the Service
  hosts:
    - host: worldcup.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration for the Ingress resource
  tls: []

autoscaling:
  # -- Enable the HorizontalPodAutoscaler (disables replicaCount)
  enabled: false
  # -- Minimum number of replicas
  minReplicas: 1
  # -- Maximum number of replicas
  maxReplicas: 3
  # -- Target average CPU utilization percentage
  targetCPUUtilizationPercentage: 80

# -- Node selector for pod scheduling
nodeSelector: {}
# -- Tolerations for pod scheduling
tolerations: []
# -- Affinity rules for pod scheduling
affinity: {}
